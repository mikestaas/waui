# The CI gate: the AGENTS.md verification list, run on every push to main
# and on pull requests.
#
#   make components / components-as / components-wat
#                                     build + lift the demos (Rust,
#                                     AssemblyScript, hand-rolled WAT)
#   make fmt-check                    the pre-commit formatter gate, backstopped
#   cargo test                        unit tests, the wasmtime roundtrip (Rust,
#                                     AS, and WAT components), the headless
#                                     --dump renders
#   make ui-test                      the AssemblyScript tree/diff unit tests
#   make web-test / -as / -wat        the Node selftest: the byte-parity gate
#   make e2e                          the Playwright browser suite: the demo
#                                     pages and the site desktop, plus the
#                                     screenshot goldens
#   host-cli smoke                    one view, then quit, on each built component
#
# Everything runs headless: the iced render is a tiny-skia software frame, the
# tui render goes to ratatui's TestBackend, the roundtrip is plain wasmtime,
# the browser is chromium. No display, no window, no GPU.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      # Regenerate the screenshot goldens (e2e/visual.spec.mjs) — run after
      # a CI runner image change shifts the font rendering.
      update_snapshots:
        description: Regenerate the screenshot goldens
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Stable Rust + the wasm32 target (rust-toolchain.toml pins both).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      # Cargo registry + target/ cache: the wasmtime/iced/ratatui builds
      # are the expensive part.
      - uses: Swatinem/rust-cache@v2

      # Node 22 for the npm toolchain (asc for the AS demos, prettier for
      # fmt-check); node_modules cached on the lockfile.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      # wabt (wasm2wat/wat2wasm) for the AS build's env.abort patch; the
      # rest is the iced link set on Linux (winit pulls x11-dl, xkbcommon-dl,
      # wayland-sys), needed at build time even though the --dump render is
      # headless.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt pkg-config libxkbcommon-dev libssl-dev \
            libwayland-dev libx11-dev libxkbcommon-x11-dev

      # Prebuilt wasm-tools for the component new / component embed lifts.
      - uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: 1.261.0

      - name: npm toolchain
        run: npm ci

      - name: Formatter gate
        run: make fmt-check

      - name: Build the components
        run: |
          make components
          make components-as
          make components-wat

      - name: Test (unit, roundtrip, headless dumps + frame goldens)
        run: cargo test

      # The AS twin of the Rust `component-ui` unit tests: the tree layer's
      # diff channel, driven through the structural cases (add, remove,
      # re-parent, id-less) that the demos do not exercise. Needs the npm
      # toolchain (asc) and wabt, both set up above.
      - name: UI tree tests (AssemblyScript)
        run: make ui-test

      - name: Web selftest (Rust, AS, and WAT)
        run: |
          make web-test
          make web-test-as
          make web-test-wat

      # Browser E2E (Playwright, chromium): the nine demo pages and the site
      # desktop in a real browser — the rendered DOM against the selftest's
      # expectations, the computed styles, the window management, and the
      # screenshot goldens (the demos' states; CI-only, because font
      # rendering is platform-specific).
      - name: Browser E2E (Playwright)
        run: |
          npx playwright install --with-deps chromium
          make e2e E2E_ARGS=${{ inputs.update_snapshots && '--update-snapshots' || '' }}

      # The regenerated goldens, for download and commit (the
      # update_snapshots input).
      - name: Upload the regenerated goldens
        if: inputs.update_snapshots
        uses: actions/upload-artifact@v4
        with:
          name: playwright-goldens
          path: e2e/screenshots

      - name: host-cli smoke (one view, then quit)
        run: |
          printf 'q\n' | cargo run -p host-cli -- target/components/demo-counter.component.wasm
          printf 'q\n' | cargo run -p host-cli -- target/components/demo-stopwatch.component.wasm
          printf 'q\n' | cargo run -p host-cli -- target/components/demo-todo.component.wasm
          printf 'q\n' | cargo run -p host-cli -- target/components/demo-counter-wat.component.wasm
          printf 'q\n' | cargo run -p host-cli -- target/components/demo-stopwatch-wat.component.wasm
          printf 'q\n' | cargo run -p host-cli -- target/components/demo-todo-wat.component.wasm
