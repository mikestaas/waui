# Deploys the demo site to GitHub Pages: the index page (?demo= and
# ?producer=, the default demo the desktop), the twelve .wasm modules, the
# nine icons, and the two browser host pages (tui/, iced/) with their
# precompiled artifacts and the registry manifest, assembled by `make site`
# in target/site/.
#
# Needs Pages enabled once: Settings → Pages → Source: GitHub Actions.

name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # The stale-artifact cleanup step deletes run artifacts.
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Stable Rust + the wasm32 target (rust-toolchain.toml pins both).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      # Cargo registry + target/ cache: the release wasm builds are the
      # expensive part.
      - uses: Swatinem/rust-cache@v2

      # Node 22 for the npm toolchain (asc for the AS demos); node_modules
      # cached on the lockfile.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      # wabt for the AS build's env.abort patch. The host cdylibs build for
      # wasm32 with no default features, so no iced link set.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt

      # Prebuilt wasm-tools for the component new / component embed lifts.
      - uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: 1.261.0

      # The wasm-bindgen CLI, version-matched to the lockfile (the browser
      # host builds run it; a mismatched CLI writes glue the runtime rejects).
      # The release tarball wraps its files in a directory; the extract
      # strips it.
      - name: Install wasm-bindgen
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)
          curl -sSfL "https://github.com/rustwasm/wasm-bindgen/releases/download/$v/wasm-bindgen-$v-x86_64-unknown-linux-musl.tar.gz" | tar xz --strip-components=1
          install -m 755 wasm-bindgen "$HOME/.cargo/bin/wasm-bindgen"
          wasm-bindgen --version

      - name: npm toolchain
        run: npm ci

      - name: Build the site
        run: make site

      # A re-run re-uploads, and the deploy step wants exactly one
      # github-pages artifact: clear the ones earlier attempts left.
      - name: Clear stale pages artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api repos/"$GITHUB_REPOSITORY"/actions/runs/"$GITHUB_RUN_ID"/artifacts \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' || true)
          for id in $ids; do
            gh api -X DELETE repos/"$GITHUB_REPOSITORY"/actions/artifacts/"$id"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/site

      # The deploy step looks the artifact up on the internal results
      # service without retry, which can run before the upload's metadata
      # indexes (a "0 artifacts" failure): wait for the artifact to appear
      # in the run's artifact list before deploying.
      - name: Wait for the pages artifact to index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 30); do
            n=$(gh api repos/"$GITHUB_REPOSITORY"/actions/runs/"$GITHUB_RUN_ID"/artifacts \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length' || echo 0)
            if [ "$n" = "1" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::the github-pages artifact count is ${n:-none} after 5m (want 1)"
          exit 1

      - id: deploy
        uses: actions/deploy-pages@v4
