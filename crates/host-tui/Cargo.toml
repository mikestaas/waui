[package]
name = "host-tui"
version = "0.0.1"
edition = "2021"

[dependencies]
wasmtime = { workspace = true }
# `unstable-rendered-line-info` enables `Paragraph::line_count`: the rows
# the hint bar needs at a given width.
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
crossterm = { workspace = true }
host-shared = { path = "../host-shared" }

[dev-dependencies]
waui-test = { path = "../waui-test" }
