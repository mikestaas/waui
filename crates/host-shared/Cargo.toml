[package]
name = "host-shared"
version = "0.0.1"
edition = "2021"

[dependencies]
# The registry manifest parser (the desktop's entries): JSON. Available on
# both targets — the native reader and the browser's `run`/`dump` parse the
# same manifest text (wasm32-unknown-unknown has std, so serde_json builds).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The default feature set pulls in `cache` (rustix/errno), which does not
# support wasm32-unknown-unknown. The reduced set keeps the component model,
# the runtime (Pulley is the default backend where Cranelift JIT is
# unavailable), and the GC proposal (the WAT demos use it). No `cranelift`
# (it enables `std`) and no `std` itself: with `std` on, `MmapVec::from_file`
# compiles against the `mmap` module, which is gated out where virtual
# memory is unavailable (wasm32). Without `std`, Wasmtime uses its no-std
# sync primitives; on a single-threaded page they never contend.
wasmtime = { version = "49", default-features = false, features = ["anyhow", "runtime", "gc", "gc-copying", "gc-drc", "gc-null", "component-model", "demangle"] }
# The browser's image assets arrive base64-encoded (the page has no
# filesystem); `decode_assets` turns them into the image state's bytes.
base64 = "0.22"
