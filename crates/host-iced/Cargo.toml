[package]
name = "host-iced"
version = "0.0.1"
edition = "2021"

[lib]
# `rlib` for the native binary; `cdylib` for the browser module
# (`--target wasm32-unknown-unknown`, wasm-bindgen).
crate-type = ["cdylib", "rlib"]

[features]
default = ["native"]
# Marker for the native binary (a real window via winit). The browser
# build passes `--no-default-features`, which excludes it.
native = []

[[bin]]
name = "host-iced"
required-features = ["native"]

[dependencies]
host-shared = { path = "../host-shared" }
# The `smol` executor provides `iced::time::every`, which the host needs
# for its 50ms clock that gates the component's requested refresh.
# `fira-sans` bundles a font: the headless `--dump` render must draw text
# deterministically, and a CI machine may have no system fonts.

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { workspace = true }
# `svg` for the registry's icons: iced's tiny-skia backend rasterizes an SVG
# on demand, synchronously, so the headless `--dump` frame carries the
# raster; the wgpu window does the same. The wasm32 build keeps the
# placeholder box (the browser module runs no registry).
iced = { workspace = true, features = ["smol", "fira-sans", "svg"] }
# The window's layout+draw path, reused by the headless `--dump` render.
iced_runtime = "0.14"
# The dump's font database, pruned to the bundled fonts so the render is
# platform-stable (see `pin_dump_fonts` in lib.rs). `fontdb` is the
# database type behind iced's text shaping.
iced_graphics = "0.14"
fontdb = { version = "0.23", default-features = false }
# PNG encoding for the `--dump` output.
png = "0.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The default feature set pulls in `cache` (rustix/errno), which does not
# support wasm32-unknown-unknown. Same reduced set as host-shared's wasm
# branch: the component model, the runtime (Pulley is the default backend
# where Cranelift JIT is unavailable), and the GC proposal. No `cranelift`
# (it enables `std`) and no `std` itself: with `std` on, `MmapVec::from_file`
# compiles against the `mmap` module, which is gated out where virtual
# memory is unavailable (wasm32).
wasmtime = { version = "49", default-features = false, features = ["anyhow", "runtime", "gc", "gc-copying", "gc-drc", "gc-null", "component-model", "demangle"] }
# The Web runtime is target-gated inside iced (iced_winit pulls web-sys
# and wasm-bindgen-futures on wasm32): the defaults minus the native-only
# pieces, and minus `wgpu`. `tiny-skia` is the only backend: the live
# page and the `dump` both render through it, so there is no fallback to
# exercise. `wgpu` is excluded because its adapter request fails where
# WebGPU is unavailable (a headless browser), and the failed attempt
# locks the canvas to a WebGPU context, so the tiny-skia fallback then
# panics on the locked 2d context. `crisp` and `web-colors` are the
# defaults' render flags, and the pixels must match; `smol` and
# `fira-sans` as natively. `thread-pool`, `x11`, `wayland`, and
# `linux-theme-detection` are native-only: the executor is always the
# wasm-bindgen one on wasm32, and the windowing backends have no target
# there.
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "crisp", "web-colors", "smol", "fira-sans"] }
iced_runtime = "0.14"
iced_graphics = "0.14"
fontdb = { version = "0.23", default-features = false }
png = "0.17"
# `block_on` for the headless renderer: the `Executor` trait has no
# `block_on` on wasm32 (it would need an event loop), but the tiny-skia
# backend is a synchronous constructor, so a plain one drives it.
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
wasm-bindgen = { workspace = true }
# `now_ms` on wasm32: `performance.now()`, mirroring the `std::time` API.
web-time = { workspace = true }

[dev-dependencies]
waui-test = { path = "../waui-test" }
