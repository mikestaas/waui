[workspace]
resolver = "2"
members = [
    "crates/demo-counter",
    "crates/demo-stopwatch",
    "crates/demo-todo",
    "crates/demo-desktop",
    "crates/host-cli",
    "crates/host-iced",
    "crates/host-tui",
    "crates/host-shared",
    "crates/host-precompile",
    "crates/component-ui",
    "crates/component-ui-macros",
    "crates/waui-test",
]

[workspace.dependencies]
wasmtime = "49"
wit-bindgen = { version = "0.63", features = ["macros"] }
iced = "0.14"
ratatui = "0.30"
crossterm = "0.29"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
web-time = "0.2"

[patch.crates-io]
# Local fork: damage tracking must include drop shadows, and shadows must
# be clipped to the layer. (See vendor/iced_tiny_skia.)
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
