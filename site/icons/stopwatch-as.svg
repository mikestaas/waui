<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Stopwatch, AssemblyScript">
  <rect x="1" y="1" width="126" height="126" rx="27" fill="#3d3320" stroke="#f2c98c" stroke-opacity="0.4" stroke-width="2"/>
<!-- The stopwatch: crown, stem, face, ticks, a hand, a side button. -->
<g fill="#f2c98c">
  <rect x="48" y="14" width="12" height="12" rx="4"/>
  <rect x="51" y="24" width="6" height="8"/>
  <rect x="70" y="36" width="16" height="7" rx="3.5" transform="rotate(45 78 39.5)"/>
</g>
<circle cx="54" cy="64" r="30" fill="none" stroke="#f2c98c" stroke-width="8"/>
<g stroke="#f2c98c" stroke-width="4" stroke-linecap="round">
  <line x1="54" y1="42" x2="54" y2="48"/>
  <line x1="76" y1="64" x2="70" y2="64"/>
  <line x1="32" y1="64" x2="38" y2="64"/>
  <line x1="54" y1="86" x2="54" y2="80"/>
</g>
<line x1="54" y1="64" x2="68" y2="50" stroke="#f2c98c" stroke-width="6" stroke-linecap="round"/>
<circle cx="54" cy="64" r="4.5" fill="#f2c98c"/>
<!-- The language chip: the AssemblyScript A; the notch between the legs
     is the logo's signature. -->
<path
  fill="#007acc"
  d="M93 84 L95.5 84 A3.5 3.5 0 0 0 102.5 84 L105 84 A9 9 0 0 1 114 93 L114 105 A9 9 0 0 1 105 114 L93 114 A9 9 0 0 1 84 105 L84 93 A9 9 0 0 1 93 84 Z"
/>
<g fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M99 88 L91 107"/>
  <path d="M99 88 L107 107"/>
  <path d="M93.3 101.5 L104.7 101.5"/>
</g>
</svg>
