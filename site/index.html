<!doctype html>
<!--
  The waui demo site — a desktop.

  The six icons are the demos (three per language). Double-clicking one
  opens the demo page in a small window; several windows may be open at
  once. The demo pages and their .wasm modules are built by `make site`
  next to this file; the pages fetch the modules, so the site needs a
  server (GitHub Pages serves it; locally, python3 -m http.server).

  The launcher itself runs straight from disk (open target/site/index.html);
  the demo windows do not (their fetch fails on file://). The script is a
  classic file, not a module: Chrome blocks file:// module scripts.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>waui — demos</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231a1b26'/><path d='M9 21 L12.5 11 L16 18 L19.5 11 L23 21' fill='none' stroke='%237aa2f7' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/></svg>"
    />
    <link rel="stylesheet" href="desktop.css" />
  </head>
  <body>
    <div id="menubar">
      <span class="menubar-name">waui</span>
      <span class="menubar-dim">wasm ui demos</span>
      <span class="menubar-spacer"></span>
      <span id="window-count" class="menubar-dim">0 windows</span>
      <span class="menubar-dim">double-click an icon to open</span>
    </div>
    <main id="desktop">
      <div id="grid"></div>
    </main>
    <div id="windows"></div>
    <script src="desktop.js"></script>
  </body>
</html>
