<!doctype html>
<!--
  The browser TUI host: the same host as the native binary, running in the
  browser as wasm. The component is a precompiled pulley32 artifact (the
  host-precompile tool; the browser has no JIT, so it only interprets),
  fetched by ?demo= and ?producer= — counter|stopwatch|todo and
  rust|as|wat, so the nine demos share this one page. The artifacts live
  in the site's shared components/ directory (the iced page fetches the
  same files), and the desktop's registry and icons at the site root.

  The desktop carries its nine entry artifacts too: the page fetches them
  in the background after the first frame and hands each to the host as it
  resolves (components_add), so a double-click opens its window once the
  fetch has landed. window.entriesReady flips once all have settled.

  The page owns the xterm.js terminal (window.term): the host draws SGR
  into it and reads its keys, and a 50ms interval drives the host's tick.
  xterm.js is vendored (vendor/, the @xterm/xterm 5.5.0 package, MIT), so
  the page needs no network beyond the artifacts, the manifest, and the
  host module.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>waui (tui host)</title>
    <link rel="stylesheet" href="vendor/xterm.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        overflow: hidden;
      }
      #badge {
        height: 28px;
        line-height: 28px;
        padding: 0 12px;
        font:
          13px ui-monospace,
          monospace;
        color: #7a86a8;
        background: #1a1b26;
      }
      #terminal {
        width: 100%;
        height: calc(100% - 28px);
      }
    </style>
  </head>
  <body>
    <div id="badge">waui (tui host) — loading</div>
    <div id="terminal"></div>
    <!-- The xterm.js package ships a UMD build; in a browser it attaches
         its exports (Terminal, ...) to globalThis. -->
    <script src="vendor/xterm.js"></script>
    <script type="module">
      const params = new URLSearchParams(location.search);
      const demo = params.get('demo') ?? 'counter';
      const producer = params.get('producer') ?? 'rust';
      // The rust producer's artifact has no suffix (demo-counter.cwasm);
      // the others do (demo-counter-as.cwasm, demo-counter-wat.cwasm). The
      // artifacts live in the site's shared components directory, one up
      // from this page.
      const suffix = producer === 'rust' ? '' : `-${producer}`;
      const artifact = `../components/demo-${demo}${suffix}.cwasm`;

      const badge = document.getElementById('badge');
      const fail = (message) => {
        badge.textContent = `waui (tui host) — ${message}`;
      };
      // ArrayBuffer to base64 (the page has no filesystem, so the icons and
      // the entry artifacts are handed to the host as bytes).
      const bufToBase64 = (bytes) => {
        let binary = '';
        for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
        return btoa(binary);
      };

      // The desktop's nine entry artifacts, in the background: the page
      // fetches each from the shared components directory and hands the
      // bytes to the host as it resolves. The host's open-entry loads from
      // that map, so a double-click that lands before its fetch resolves
      // fails until the next one. window.entriesReady flips once all have
      // settled, so a test (or a hurried user) can wait for them.
      function prefetchComponents(mod, manifest) {
        const entries = JSON.parse(manifest).entries;
        let pending = entries.length;
        const settled = () => {
          if (--pending === 0) window.entriesReady = true;
        };
        for (const entry of entries) {
          // The manifest's path is the native component file (demo-counter.
          // component.wasm); the site serves the precompiled artifact under
          // the same base name (demo-counter.cwasm).
          const base = entry.path
            .split('/')
            .pop()
            .replace(/\.component\.wasm$/, '.cwasm');
          fetch(`../components/${base}`)
            .then((r) => {
              if (!r.ok) throw new Error(`HTTP ${r.status}`);
              return r.arrayBuffer();
            })
            .then((buf) => mod.components_add(entry.path, bufToBase64(new Uint8Array(buf))))
            .catch((e) => console.error(`components ${entry.path}: ${e.message}`))
            .finally(settled);
        }
      }

      // The page owns the terminal; the host's run reads window.term and
      // wires the keyboard and resize to it.
      const term = new Terminal({
        cols: 80,
        rows: 24,
        fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace',
        fontSize: 14,
        cursorBlink: true,
      });
      term.open(document.getElementById('terminal'));
      window.term = term;

      try {
        const mod = await import('./host_tui.js');
        await mod.default();
        badge.textContent = `waui (tui host) — loading ${artifact}`;
        const bytes = new Uint8Array(await (await fetch(artifact)).arrayBuffer());
        // The desktop carries the registry (the manifest) and the icons; the
        // browser has no filesystem, so the page fetches both and hands them
        // over. The other demos carry neither. The manifest and the icons
        // live at the site root, one directory up from this page.
        let manifest = null;
        let assets = null;
        if (demo === 'desktop') {
          manifest = await (await fetch('../registry.json')).text();
          const obj = {};
          for (const entry of JSON.parse(manifest).entries) {
            // The manifest's icon paths are the repo's (site/icons/); the
            // site serves the same set from its root icons/ directory. The
            // asset map keeps the manifest's key (the component's `src`).
            const icon = entry.data.icon;
            const url = icon.startsWith('site/') ? `../${icon.slice('site/'.length)}` : icon;
            const resp = await fetch(url);
            if (resp.ok) {
              obj[icon] = bufToBase64(new Uint8Array(await resp.arrayBuffer()));
            }
          }
          assets = JSON.stringify(obj);
        }
        // `null` components: the grid's first frame never waits for the
        // entry artifacts; they are added as the background fetches resolve.
        mod.run(bytes, manifest, assets, null);
        badge.textContent = `waui (tui host) — ${demo} (${producer})`;
        if (demo === 'desktop') {
          prefetchComponents(mod, manifest);
        }
        // The host's 50ms clock: wake the components whose refresh period
        // has elapsed, apply the diffs, and redraw.
        setInterval(() => mod.tick(), 50);
      } catch (err) {
        fail(`${err.message} (${artifact})`);
      }
    </script>
  </body>
</html>
