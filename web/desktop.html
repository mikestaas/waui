<!doctype html>
<!--
  waui web host — the desktop, as a component.

  Unlike the app pages (index.html), this page runs the `demo-desktop`
  component on the `desktop` world: the component owns the icon grid and the
  menu bar's window count, and the host implements the two imports it calls
  (`list-demos`, the registry; `open-window`, the windowing layer). Each open
  window embeds a demo component (the `app` world), rendered in place rather
  than in an iframe.

  build-desktop.mjs fills three placeholders: the wasm boot script (the
  `demo-desktop` module, inlined base64 or fetched with --url), the host's JS
  (glue.js + desktop.js, concatenated), and the name. The demo modules and the
  icons are fetched at runtime, so the page needs a server (make site).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>waui — __WAUI_NAME__</title>
    <style>
      /* The desktop: the wallpaper, the menu bar, the icon grid, and the
         windows. The palette is the demos' own (Tokyo Night), one shade
         darker for the wallpaper so a window reads as a window. */
      :root {
        --bg: #14151d;
        --bg2: #1a1b26;
        --panel: #24283b;
        --line: #414868;
        --text: #c0caf5;
        --dim: #565f89;
        --accent: #7aa2f7;
        --negative: #f7768e;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: radial-gradient(1100px 700px at 50% 28%, #1e2130 0%, var(--bg) 75%), var(--bg);
        color: var(--text);
        font:
          15px/1.5 ui-sans-serif,
          system-ui,
          sans-serif;
      }

      /* The widget tokens, as the demos' own (web/index.html). The embedded
         demo trees and the desktop's own text both use them. */
      .waui {
        display: flex;
        gap: 8px;
      }
      .waui-column {
        flex-direction: column;
        align-items: center;
      }
      .waui-row {
        flex-direction: row;
        align-items: center;
      }
      .waui-align-start {
        align-items: flex-start;
      }
      .waui-align-end {
        align-items: flex-end;
      }
      .waui-neutral {
        color: var(--text);
      }
      .waui-accent {
        color: var(--accent);
      }
      .waui-positive {
        color: #9ece6a;
      }
      .waui-negative {
        color: var(--negative);
      }
      .waui-warning {
        color: #e0af68;
      }
      .waui-small {
        font-size: 0.85em;
      }
      .waui-large {
        font-size: 1.8em;
      }
      .waui-button {
        padding: 6px 16px;
        background: #24283b;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .waui-button:hover {
        background: #2a2e44;
      }
      .waui-input {
        padding: 6px 10px;
        background: #1a1b26;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: inherit;
        font: inherit;
        width: 12ch;
      }
      .waui-image {
        display: block;
      }

      /* The menu bar sits above the windows, like a desktop's. */
      #menubar {
        position: fixed;
        inset: 0 0 auto 0;
        z-index: 10000;
        height: 34px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px;
        background: rgba(20, 21, 29, 0.85);
        border-bottom: 1px solid var(--line);
        font-size: 13px;
      }
      .menubar-name {
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      .menubar-dim {
        color: var(--dim);
      }
      .menubar-spacer {
        flex: 1;
      }
      .menubar-link {
        color: var(--accent);
        text-decoration: none;
      }
      .menubar-link:hover {
        text-decoration: underline;
      }
      /* The component's count node, restyled as a menu-bar span. */
      #window-count {
        color: var(--dim);
      }

      /* The icon grid, centered on the wallpaper below the menu bar. The
         component's grid is a column of rows; the centering and the gaps
         (the reference's 28px / 44px) are applied here. */
      #grid {
        position: absolute;
        inset: 34px 0 0 0;
        display: grid;
        place-content: center;
      }
      .grid {
        gap: 28px;
      }
      .grid-row {
        gap: 44px;
      }

      .tile {
        gap: 7px;
        padding: 10px 14px;
        border-radius: 18px;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        transition:
          transform 120ms ease,
          box-shadow 120ms ease;
      }
      .tile img {
        filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.35));
        transition: filter 120ms ease;
      }
      .tile:hover {
        transform: translateY(-4px) scale(1.03);
      }
      .tile:hover img {
        filter: drop-shadow(0 14px 26px rgba(0, 0, 0, 0.45));
      }
      .tile.selected {
        box-shadow: 0 0 0 2px var(--accent);
      }
      .tile:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }
      .tile-name {
        font-size: 15px;
        font-weight: 600;
      }
      .tile-lang {
        margin-top: -3px;
        font-size: 12px;
        color: var(--dim);
      }

      /* The window layer: a full-viewport container that lets clicks through
         to the desktop; only the windows themselves take events. */
      #windows {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .window {
        position: absolute;
        pointer-events: auto;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5);
        overflow: hidden;
        /* Backs the grip's JS clamp (desktop.js). */
        min-width: 220px;
        min-height: 260px;
      }
      .titlebar {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        padding: 0 8px 0 12px;
        background: #1e2130;
        border-bottom: 1px solid var(--line);
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
      }
      .titlebar.dragging {
        cursor: grabbing;
      }
      .titlebar img {
        width: 18px;
        height: 18px;
      }
      .titlebar-title {
        flex: 1;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .close {
        flex: none;
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        background: none;
        border: none;
        border-radius: 6px;
        color: var(--dim);
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
      }
      .close:hover {
        background: rgba(247, 118, 142, 0.18);
        color: var(--negative);
      }
      /* The embedded demo's tree, centered in the window's content area (the
         app pages' own centering). */
      .window-content {
        flex: 1;
        width: 100%;
        display: grid;
        place-items: center;
        background: var(--bg2);
        overflow: auto;
      }
      /* The corner grip: the drag handle that resizes the window. */
      .grip {
        position: absolute;
        right: 3px;
        bottom: 3px;
        width: 14px;
        height: 14px;
        z-index: 1;
        cursor: nwse-resize;
        background-image: repeating-linear-gradient(45deg, transparent 0 3px, var(--dim) 3px 4px);
        -webkit-mask-image: linear-gradient(315deg, #000 30%, transparent 75%);
        mask-image: linear-gradient(315deg, #000 30%, transparent 75%);
        opacity: 0.8;
      }
      .grip.dragging {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="menubar">
      <span class="menubar-name">waui</span>
      <span class="menubar-dim">wasm ui demos</span>
      <span class="menubar-spacer"></span>
      <span id="window-count" class="menubar-dim">0 windows</span>
      <span class="menubar-dim">double-click an icon to open</span>
      <a
        class="menubar-link"
        href="https://github.com/mikestaas/waui"
        target="_blank"
        rel="noopener"
        >GitHub</a
      >
    </div>
    <main id="desktop">
      <div id="grid"></div>
    </main>
    <div id="windows"></div>
    __WAUI_WASM_BOOT__
    <script type="module">
      __WAUI_JS__;
    </script>
  </body>
</html>
